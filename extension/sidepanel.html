<!doctype html>
<html lang="en" translate="no">
<head>
  <meta charset="utf-8">
  <title>LMS Helper</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <header class="top">
    <h1>LMS Helper</h1>
    <span class="synced" id="synced" hidden data-i18n="synced"></span>
  </header>

  <p class="guide" data-i18n="guide"></p>

  <section class="panel open">
    <h2 data-i18n="settings"></h2>
    <label class="row">
      <span data-i18n="language"></span>
      <select id="lang"></select>
    </label>
    <p class="ct-warn" id="ct-warn" hidden data-i18n="ctUnsupported"></p>
    <label class="switch">
      <input type="checkbox" id="theme">
      <span data-i18n="theme"></span>
    </label>
    <p class="hint" data-i18n="themeHint"></p>
  </section>

  <details class="panel dev">
    <summary data-i18n="dev"></summary>
    <div class="dev-buttons">
      <button data-check="check-session">세션 API 확인</button>
      <button data-check="check-file">교안 다운로드 확인</button>
      <button data-check="get-translate-state">크롬 번역 상태</button>
      <button data-check="check-translate-block">번역 차단 확인</button>
    </div>
    <pre id="out">진단 결과</pre>
  </details>

  <script src="config.js"></script>
  <script src="i18n.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
